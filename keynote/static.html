ployee-bar","n":22,"act":"limits","ground":"paper","plannedSec":120,"icon":"constraints","steps":["The finding","An example: the “new” chess game","Three signs of missing judgment"],"brief":"The clearest independent test of real work: no model met the bar Epoch sets for its own employees.","mode":"data","copy":{"title":"AI knows a lot. It still lacks judgment.","sub":"Epoch AI gave the top models real research work, the kind its own team does. None did it as well as Epoch expects from its own staff.","example":"Asked to invent a new version of chess, the best model’s “new” game played exactly like one that already exists.","failuresTitle":"Three signs of missing judgment","failures":["They repeat old ideas.","They stop at the first try.","They rate their own work above people’s work."],"tag":"Independent · Epoch AI, 17 Nov 2026"}},{"id":"economics","n":23,"act":"limits","ground":"paper","plannedSec":60,"icon":"tradeoffs","steps":["The contractor: 16 hours of paid work","Two Claude models: quality and cost","Takeaway: the best model isn’t always the best buy"],"brief":"Smarter isn't always cheaper: on one task, the bigger model cost more than the human contractor.","mode":"data","copy":{"title":"Smarter isn’t always cheaper","sub":"One real task, measured by Epoch AI: analysing an AI data centre.","base":{"who":"A human contractor","quality":"The reference","cost":"16 hours of paid work"},"a":{"model":"Claude Opus 5.5","quality":"Contractor-level work","cost":"Cheaper than the contractor","good":true},"b":{"model":"Claude Fable 5.2","quality":"Better work","cost":"More expensive than the contractor","good":false},"takeaway":"The best model isn’t always the best buy.","tag":"Independent · Epoch AI, 17 Nov 2026 · one task; Epoch published no dollar figures"}},{"id":"rulers-break","n":24,"act":"limits","ground":"paper","plannedSec":75,"icon":"uncertainty","steps":["A famous test can no longer rank the models","The famous METR chart stopped","Models notice when they are tested","Every model tried to cheat"],"brief":"The instruments that measure AI are saturating, being gamed and losing sight of reasoning.","mode":"data","copy":{"title":"The measuring instruments are breaking","items":[{"value":"98.5%","label":"Nine models share the top score on a famous test. It can no longer rank them."},{"value":"16 h","label":"The famous METR chart stopped in September: its tests stop being reliable past 16 hours of work."},{"value":"36% vs 0.4%","label":"Claude showed signs it knew it was being tested in 36% of tests, but in 0.4% of real use. So tests may not show real behaviour."}],"quote":"“Every model tested in this analysis attempted to cheat some of the time.”","quoteWho":"UK AI Security Institute"}},{"id":"breach","n":25,"act":"limits","ground":"void","plannedSec":120,"icon":"constraints","steps":["The sandbox","The escape: Hugging Face, July 2026","Under 13 hours to cluster-admin · ~700 agents","The motive","Not a one-off: OpenAI, 23 Oct"],"brief":"Agents under test escaped and reached the real world. The motive: finishing the task.","mode":"burst","copy":{"title":"Agents under test reached the real world","s1":"July 2026: agents in an OpenAI cyber evaluation, with safety classifiers deliberately off, escaped their sandbox and broke into Hugging Face.","s2":{"value":"\u003c 13 hours","label":"to cluster-admin on multiple internal clusters"},"s3":{"value":"~700","label":"agents joined the attack (METR's count)"},"motive":"Apparently “an attempt to cheat the evaluation.”","tag":"Hugging Face, 27 Jul · METR, 26 Aug 2026"}},{"id":"recipe","n":26,"act":"limits","ground":"paper","plannedSec":60,"icon":"constraints","steps":["The four ingredients","The lesson"],"brief":"Every documented incident shares one recipe. The lesson is operational.","mode":"calm","copy":{"title":"The recipe that keeps recurring","parts":["An impossible or misconfigured task","Safeguards off","Internet on","“NEVER stop, NEVER give up”"],"lesson":"Sandbox them. Monitor them. Let them give up."}},{"id":"power","n":27,"act":"limits","ground":"void","plannedSec":90,"icon":"constraints","steps":["The grid","6,831 MW short","A third of Colombia (if verified)","Data centres: 38.2% of the bill"],"brief":"Power is now a measured limit: the largest US grid cannot promise the electricity new data centres need.","mode":"burst","copy":{"title":"Power is now the limit","value":"6,831 MW","label":"short of its reliability requirement: PJM, the largest US grid (2028/29 auction)","compare":"≈ a third of Colombia's installed generating capacity","share":"38.2%","shareLabel":"of $16.4B in capacity charges came from data-centre load"}},{"id":"brazil","n":28,"act":"limits","ground":"void","plannedSec":105,"icon":"constraints","steps":["The globe and the chip flows","The 16 Nov rule: Brazil on the list","Where the compute is: 72% US, ~10% China","Latin American press: Exame, 17 Nov"],"brief":"Compute now needs a licence, and the rule reaches Latin America: Brazil is on the list, effective around today.","mode":"burst","copy":{"title":"Compute now needs a licence","rule":"16 Nov 2026 · US Commerce Department (BIS) rule","line":"Advanced AI chips bound for Brazil now need a US licence, except for US-headquartered buyers.","others":"Also: Indonesia · Malaysia · Singapore · Thailand","effective":"In force on publication in the Federal Register, scheduled for 19 Nov.","share":"72% of the AI compute delivered since 2022 sits in the US. About 10% in China."}},{"id":"news-tunnel","n":29,"act":"world","ground":"void","plannedSec":30,"icon":"uncertainty","steps":["Fly through the wall of real captures","Act title"],"brief":"We fly through what the world is saying: real posts and headlines from the last 30 days.","mode":"burst","copy":{"act":"IV","actTitle":"What the world is saying"}},{"id":"money","n":30,"act":"world","ground":"paper","plannedSec":90,"icon":"value","steps":["$105B run-rate","Anthropic files to list as “ANT”","Hyperscaler capex","Headlines"],"brief":"The money: run-rates, an IPO, and capex at a scale no industry has seen.","mode":"data","copy":{"title":"Follow the money","items":[{"value":"$105B","label":"combined revenue run-rate, OpenAI + Anthropic, late summer 2026 (from about $30B early in the year)","tag":"Lab-reported, via State of AI 2026"},{"value":"“ANT”","label":"Anthropic filed to list on Nasdaq (S-1, 26 Oct); roadshow from 10 Nov","tag":"Official"},{"value":"~$720–740B","label":"hyperscalers' 2026 capital spending guidance","tag":"Secondary · not checked against filings"}]}},{"id":"x-voices","n":31,"act":"world","ground":"paper","plannedSec":90,"icon":"speed","steps":["Post 1","Post 2","Post 3","Post 4","Post 5"],"brief":"On X this month: the posts that moved the conversation, with their real reach.","mode":"collage","copy":{"title":"On X this month","countsLabel":"views"}},{"id":"tabloids","n":32,"act":"world","ground":"paper","plannedSec":60,"icon":"uncertainty","steps":["Headlines slam in","Hold the wall","Two headlines up close"],"brief":"Meanwhile, the headlines: rogue agents, superintelligence, the backlash. Fast, loud, real.","mode":"collage","copy":{"title":"Meanwhile, in the headlines"}},{"id":"two-speeds","n":33,"act":"world","ground":"paper","plannedSec":90,"icon":"speed","steps":["The labs: how fast the frontier moves","The real economy: how fast companies adopt","The gap"],"brief":"The labs move at lab speed; the real economy moves at adoption speed. They cannot be compared directly, and the gap is where 2027 is decided.","mode":"data","copy":{"title":"Two speeds","labsLabel":"The labs","labsPace":"Measured in weeks","economyLabel":"The real economy","economyPace":"Measured in years","labs":[{"fact":"releases-sep-nov","label":"new frontier models in 11 weeks"},{"fact":"claude-90-merged","label":"of Anthropic's code written by Claude"}],"economy":[{"fact":"census-btos-ai-246","label":"of US businesses use AI","delta":"from 17.3% in Nov 2025"},{"fact":"cetic-br-ai-17","label":"of Brazilian firms (10+ staff) use AI","delta":"from 13% in 2024"}],"line":"The frontier moves at lab speed. Your company moves at adoption speed."}},{"id":"rules","n":34,"act":"world","ground":"paper","plannedSec":30,"icon":"constraints","steps":["Three jurisdictions, three rules"],"brief":"The binding rules now land on deployment, not training.","mode":"calm","copy":{"title":"Rules now land on deployment, not training","items":["EU AI Act · since 2 Aug: disclose chatbots, label deepfakes","China · since 15 Jul: companion AI must not foster emotional dependence","United States · chip access needs licences; agencies now say “Super Intelligence”"]}},{"id":"so-what","n":35,"act":"next","ground":"paper","plannedSec":30,"icon":null,"steps":["Act title","The question"],"brief":"Turn to the audience.","mode":"calm","copy":{"act":"V","actTitle":"What you do next","line":"So what do you decide for 2027?"}},{"id":"motor","n":36,"act":"next","ground":"void","plannedSec":105,"icon":"value","steps":["The old factory: one line shaft drives everything","Motors bolted onto the old shaft","The floor redesigned around the motor","The lesson"],"brief":"We have seen this before: the electric motor paid off only when factories were redesigned around it.","mode":"burst","copy":{"title":"We have seen this before","s1":"Around 1900, factories bolted electric motors onto the old line shaft.","s2":"The big gains came decades later, when they redesigned the floor around the motor.","s3":"The gains came from redesigning the work around the motor, not from adding the motor.","source":"Paul A. David, “The Dynamo and the Computer,” American Economic Review, 1990"}},{"id":"approach","n":37,"act":"next","ground":"paper","plannedSec":75,"icon":"value","steps":["Title","Four before → after rows"],"brief":"Approach: redesign the work, don't bolt AI onto it.","mode":"calm","copy":{"title":"Approach: redesign, don't bolt on","headers":["Bolted on","Redesigned"],"rows":[["Information moves by hand","Information is there at the point of work"],["People coordinate every step","AI executes; people handle judgment and exceptions"],["Decisions happen after the fact","Decisions happen inside the workflow"],["Training is separate from the work","Teams learn by operating the new system"]]}},{"id":"checkable","n":38,"act":"next","ground":"paper","plannedSec":75,"icon":"tradeoffs","steps":["Cheap to check vs needs judgment","The takeaway"],"brief":"The frontier's own lesson: AI leaps where results are cheap to check. Start there, and build the check first.","mode":"calm","copy":{"title":"Start where checking is cheap","left":{"label":"Cheap to check","examples":"code · proofs · reconciliations · invoice matching","note":"where AI gains are fastest"},"right":{"label":"Needs judgment to check","examples":"strategy · research · taste","note":"where AI still lags"},"takeaway":"Choose work whose result you can verify. Build the check first.","tag":"Our reading, in line with published AI research"}},{"id":"roles","n":39,"act":"next","ground":"paper","plannedSec":75,"icon":"value","steps":["Workflow owner","Verifier","Operator","Callback: judgement is the last job"],"brief":"Roles for 2027: an owner, a verifier, an operator. Judgment stays human.","mode":"calm","copy":{"title":"Roles for 2027","roles":[{"name":"Workflow owner","job":"Accountable for the outcome. Approves what ships."},{"name":"Verifier","job":"Builds the checks every output must pass."},{"name":"Operator","job":"Runs the agents. Handles the exceptions."}],"callback":"“Judgement is the last job.”"}},{"id":"think-twice","n":40,"act":"next","ground":"paper","plannedSec":135,"icon":null,"steps":["Title","1","2","3","4","5"],"brief":"The heart of the close: five decisions to think twice about in 2027, each backed by tonight's evidence.","mode":"calm","copy":{"title":"Think twice before you…","items":[{"text":"…sign a multi-year AI contract priced on today's capability.","icon":"tradeoffs","why":"The same capability gets about 13× cheaper a year."},{"text":"…bet everything on one model.","icon":"uncertainty","why":"No single winner: the leader changes with the ruler and the task. Use several models."},{"text":"…give an agent the internet without a sandbox.","icon":"constraints","why":"Most documented incidents share a recipe: internet on, safeguards off."},{"text":"…measure AI by usage.","icon":"value","why":"Usage is not results. Count human minutes per job."},{"text":"…wait for certainty.","icon":"speed","why":"The frontier moved about seven months in 11 weeks."}]}},{"id":"first-move","n":41,"act":"next","ground":"paper","plannedSec":105,"icon":"value","steps":["Pick one workflow","Redesign it as if founded today","Measure human minutes per job"],"brief":"The first move for Monday: one workflow, redesigned, one number.","mode":"calm","copy":{"title":"Your first move","steps":["Pick one recurring workflow that takes days or weeks.","Redesign it as if your company were founded today.","Measure one number: human minutes per job."],"scale":["weeks","days","hours","minutes"]}},{"id":"callback","n":42,"act":"close","ground":"void","plannedSec":45,"icon":"speed","steps":["Speed streaks return","The line"],"brief":"Echo of the opening speed, then stillness: the plan has to move with the frontier.","mode":"burst","copy":{"line1":"In 11 weeks, the frontier moved about seven months.","line2":"Your 2027 plan has to move with it."}},{"id":"close-line","n":43,"act":"close","ground":"paper","plannedSec":75,"icon":"uncertainty","steps":["Uncertainty is a material to work with","not a reason to wait","The best options are built."],"brief":"Irina's belief, to close: uncertainty is material, not a reason to wait. The best options are built.","mode":"calm","copy":{"line1":"Uncertainty is a material to work with,","line2":"not a reason to wait.","line3":"The best options are built."}},{"id":"end","n":44,"act":"close","ground":"void","plannedSec":90,"icon":null,"steps":["Title and name","LinkedIn QR and Questions"],"brief":"Mirror of the title. Name, LinkedIn, questions.","mode":"calm","copy":{"title":"Inside the AI Frontier","name":"Irina Vélez","role":"Founder, Deltanova","link":"linkedin.com/in/irina-velez","url":"https://www.linkedin.com/in/irina-velez/","cta":"Questions","sourcesLabel":"All sources","sourcesUrl":"https://inside-the-ai-frontier.vercel.app/sources.html"}}]},"notes":{"opener":{"notes":["Say nothing while the film runs; let it land on the title.","Cue: Speed. The whole night is about how fast the frontier moves.","If the film fails, the fallback flashes real release names and dates from tonight's facts and lands on the same title."],"sources":[],"transition":"Hold on the title, then greet the room."},"title":{"notes":["Greet; your name; Deltanova in one line: we help Latin American companies redesign how they operate around AI.","Format: about 60 minutes, five stops, then questions.","Every number tonight has a public source; anyone can ask for it."],"sources":[],"transition":"Black opens to white: one question for the night."},"question":{"notes":["The one question: what will you decide differently in 2027?","Invite them to hold one real decision in mind (a contract, a hire, a project) and test it at each stop.","The route: San Francisco → the labs → their limits → what the world says → what you do next."],"sources":[],"transition":"First stop: San Francisco, last week."},"sf-arrival":{"notes":["AI Engineer Code Summit, San Francisco, 10–12 Nov 2026: 80 sessions in 3 days (our count from the official schedule).","Builders talking to builders: engineers and founders who ship AI-written code every day.","Optional (your observation): «In SF, builders ask different questions.»","Cue: Speed."],"sources":[{"label":"AI Engineer · Code Summit 2026 schedule","url":"https://ai.engineer/code/2026/sessions.json"}],"transition":"What were those 80 talks about?"},"sf-topics":{"notes":["Biggest cluster: shipping AI-written code at volume, 34 of 80 talks (factories 13, verification 8, coding agents 8, large codebases 5).","Our grouping of titles and abstracts; the schedule has no official topic tags; 2 talks had no published title.","Enterprise adoption: only 3 talks. The builders' question is how much and how safely, not whether."],"sources":[{"label":"AI Engineer · Code Summit 2026 schedule","url":"https://ai.engineer/code/2026/sessions.json"}],"transition":"What does shipping at volume look like? Three real numbers from the stage.","ifAsked":["Shanghai's AI Engineer event (5–6 Nov, 52 sessions) leaned to world models, data infrastructure and evals instead."]},"factory":{"notes":["Software factory: agents write, test and ship; people set direction and check. A pull request is a proposed change to the code.","Grok Bot team (SpaceXSI): 809 merged pull requests in June → 10,926 in October. From their own slide.","Ramp: 75% of all merged code is written and shipped by its in-house agent, Inspect (Ramp's slide, 11 Nov).","Cognition: Devin wrote 92% of its merged pull requests in September (talk abstract; Cognition sells Devin).","All company-reported, none audited: read them as direction, not benchmarks.","Cue: Speed."],"sources":[{"label":"Lauren Tan, All Code Is Slop (Except Mine) · slide at 13:34","url":"https://www.youtube.com/watch?v=O_zcc6Xl12g&t=813"},{"label":"Zach Bruggeman, Ramp · Day 1 livestream at 7:51:01","url":"https://www.youtube.com/watch?v=ZZ19zhYnDKY&t=28260"},{"label":"Theodor Marcu, Cognition · session abstract","url":"https://ai.engineer/code/2026/sessions.json"}],"transition":"The most-watched talk of the summit went straight at quality.","ifAsked":["Cognition also says 9 in 10 Devin sessions start without a human (abstract).","Ramp on stage said “around 75%”; its abstract says ~75% of merged pull requests."]},"slop":{"notes":["Lauren Tan, SpaceXSI: «All Code Is Slop (Except Mine)». 925,237 YouTube views by 18 Nov, posted 14 Nov: the most-watched summit video now.","Her line: «Last month our team shipped a ridiculous 11,000 pull requests to production.»","Volume up 13× (809 → 10,926 a month) while reverts halved (0.98% → 0.47% of commits). Her team's own numbers.","How: lint rules, automated tests, runtime checks and formal verification. The checks do the reading.","Cue: Trade-offs. They bought speed by investing in checks, not by skipping them.","Update the view count on show morning."],"sources":[{"label":"YouTube · All Code Is Slop (Except Mine)","url":"https://www.youtube.com/watch?v=O_zcc6Xl12g"},{"label":"Revert-rate slide at 14:17","url":"https://www.youtube.com/watch?v=O_zcc6Xl12g&t=856"}],"transition":"If the checks carry the load, what about the code around the model?","ifAsked":["On 17 Nov Lydia Hallie's Claude Code talk had slightly more views (747,653 vs 746,083); by 18 Nov Tan's led (925,237 vs 813,761).","She says the revert rate is “steady at about half a percent.”"]},"lean-harness":{"notes":["Philipp Schmid, Google DeepMind. His talk title: «I deleted 90% of my harness, and it got better.»","Harness: the code, tools and prompts wrapped around a model.","He cut his custom tools down to Bash and a 300-token prompt; he says benchmark scores jumped (his own experience, no numbers given).","His line: «Models will keep eating the harness.» Whatever you build around today's model, the next one absorbs.","Cue: Trade-offs. Build less around the model."],"sources":[{"label":"Philipp Schmid · Day 1 livestream at 2:20:48","url":"https://www.youtube.com/watch?v=ZZ19zhYnDKY&t=8447"},{"label":"Session abstract","url":"https://ai.engineer/code/2026/sessions.json"}],"transition":"And it's not only code: companies are reorganizing around the agent."},"org":{"notes":["Amp (Quinn Slack, CEO): 21 co-founders, more than $100M ARR, 1/10 to 1/30 the headcount of comparable companies. Company-reported, on stage, 12 Nov.","«We had to stay at 21 people… a forcing function for us to work differently.»","Their abstract adds: no traditional roles, everyone pushes to main, one meeting a week.","The point: the constraint (no hiring) forced the redesign.","Optional (your observation): «Most LATAM organizations are optimizing instead of redesigning.»","Cue: Value."],"sources":[{"label":"Quinn Slack, A Company Built Around the Agent · Day 2 livestream at 8:02:52","url":"https://www.youtube.com/watch?v=y9JtCCZP2MQ&t=28971"},{"label":"Session abstract","url":"https://ai.engineer/code/2026/sessions.json"}],"transition":"When agents write the work, the bottleneck moves to checking it."},"verification":{"notes":["8 of 80 talks were about verification and code review (our grouping).","ZoomInfo (Brian Kennedy) tested the AI judge that grades its agents on 500 production steps: it was right 65% of the time, «more or less a coin flip».","It accepted 118 bad steps: more than 1 in 4 of everything it approved.","Most common miss: the agent reported an action no tool performed. «The agent made it up and the judge approved it.»","ZoomInfo's own test of its own system.","Cue: Constraints. An AI checking an AI is not a check until you test the checker."],"sources":[{"label":"Brian Kennedy, Your Judge Is Hallucinating Too · Day 1 livestream at 6:16:04","url":"https://www.youtube.com/watch?v=ZZ19zhYnDKY&t=22563"}],"transition":"Which leads to the line that sums up San Francisco."},"last-job":{"notes":["Let the line sit before speaking. «Judgement is the last job.» Talk title, Ishaan Dey, Antigravity (Google DeepMind), 12 Nov.","His advice: «Protect your judgment and build things that people want.»","The thread for the rest of the night: judgment is what doesn't come with the model.","Cue: Value."],"sources":[{"label":"Ishaan Dey, Judgement is the Last Job · Day 2 livestream at 6:08:43","url":"https://www.youtube.com/watch?v=y9JtCCZP2MQ&t=22122"}],"transition":"Now: what are the labs themselves showing?"},"three-labs":{"notes":["Act II. Three labs share the frontier: Anthropic, OpenAI, Google DeepMind.","Each shipped its current flagship in the last ten days: Claude Fable 5.2 (9 Nov), Gemini 4 Carbon (generally available 10 Nov), GPT-6.2 Astra (17 Nov, two days ago).","Carbon first went to vetted cyber defenders on 28 Oct; 10 Nov is general availability.","Which of the three leads depends on the ruler; we'll see that in a few minutes."],"sources":[{"label":"Anthropic · Claude Fable 5.2 and Mythos 5.2, 9 Nov","url":"https://www.anthropic.com/news/claude-fable-and-mythos-5-2"},{"label":"OpenAI · GPT-6.2 system card, 17 Nov","url":"https://deploymentsafety.openai.com/gpt-6-2-astra-sol"},{"label":"Google · Gemini 4 Carbon now available, 10 Nov","url":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-carbon-now-available/"}],"transition":"And they no longer ship once a year.","ifAsked":["Meta's Muse Wonder (12 Oct, closed weights) sits a tier lower; xAI's Grok 4.7 is outside Artificial Analysis's top 15."]},"release-pace":{"notes":["1 Sep → 17 Nov, 11 weeks: 14 new model releases from three labs. Anthropic 5, Google 4, OpenAI 5. About one every five or six days.","Anthropic: Fable 5.1, Opus 5.5, Sonnet 5.5, Haiku 5.5, Fable 5.2. Google: Gemini 3.8 Flash, 4 Argon, 4 Carbon, 4 Hydrogen.","OpenAI: GPT-6 Astra, GPT-6 Sol and Luna, GPT-6.1 Sol, GPT-6 Cyber (vetted users only), GPT-6.2 Astra and Sol.","Our counting rule: each new general-purpose model once; image and voice models and wider rollouts not counted.","Cue: Speed. Planning cycles are annual; the frontier moves in weeks."],"sources":[{"label":"Claude release notes","url":"https://support.claude.com/en/articles/12138966-release-notes"},{"label":"Google Cloud · Gemini model versions","url":"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-versions"},{"label":"OpenAI · GPT-6.2 system card","url":"https://deploymentsafety.openai.com/gpt-6-2-astra-sol"}],"transition":"Did the models get better, or just newer? The independent rulers say better.","ifAsked":["One more OpenAI model, GPT-6.1 Terra, has no published release date; if it fell in the window the count is 15.","Three OpenAI dates rest on a developer post, a system-card appendix and search-index text, because openai.com blocks automated reading."]},"year-in-weeks":{"notes":["Epoch Capabilities Index (independent): one score that combines dozens of tests. 22 frontier records from GPT-4 (Mar 2023, 121.6) to GPT-6.2 Astra (17 Nov 2026, 174.2), on Epoch's current scale.","The climb got steeper with reasoning models: about 16.6 points a year since Sep 2024, against about 8 before (Epoch's current method).","The last 11 weeks: 164.7 to 174.2, +9.4 points. At 16.6 a year that is about seven months of progress, roughly 2.7 times the usual pace. That conversion is our arithmetic (estimate).","Honest caveat: two releases drove most of it (GPT-6 Astra, then Fable 5.2 and GPT-6.2 Astra), Fable 5.2's 173.5 is preliminary, and Epoch calls the record «just one data point». Plan for jumps; don't annualize them.","Cue: Speed."],"sources":[{"label":"Epoch AI · The Epoch Brief, 11 Nov","url":"https://epochai.substack.com/p/the-epoch-brief-november-11-2026"},{"label":"Epoch AI · ECI frontier trend, 1 Sep","url":"https://epoch.ai/data-insights/eci-frontier-trend"},{"label":"Artificial Analysis · Intelligence Index v5, 27 Oct","url":"https://artificialanalysis.ai/articles/artificial-analysis-intelligence-index-v5"}],"transition":"What does that look like in practice? The peak of the night.","ifAsked":["Epoch changed its scoring method on 4 Nov (strong models moved about 1 point); Fable 5.2's 174 is from pre-launch testing and may change.","Artificial Analysis updated its index after launch: Opus 5.5 showed 58 on 27 Oct and 59 now, so on one scale the jump is about 6 points, not 7."]},"swarm":{"notes":["Lab-reported by Anthropic, 9 Nov: an engineer gave Claude Fable 5.2 an empty folder and the task of designing a prototype operating system.","Over 1,000 subagents worked around the clock for 8 days.","Result: a working operating system that boots on a laptop. A prototype, not a product, and not independently checked.","What's new is the shape: one model coordinating a thousand others for a week.","Cue: Speed."],"sources":[{"label":"Anthropic · Introducing Claude Fable 5.2, 9 Nov","url":"https://www.anthropic.com/news/claude-fable-and-mythos-5-2"}],"transition":"And the lab uses the same thing to build itself."},"self-build":{"notes":["Over 90% of the changes merged into Anthropic's core codebase are written by Claude, with people guiding (Anthropic, 9 Nov).","Claude “leads” 26% of Anthropic's AI R&D work, up from under 1% in February. Still its latest figure (August; published 17 Sep). “Leads” = does most of a task from a short brief while a person supervises.","Newest, and from outside: METR worked inside Anthropic from August to October. Its estimate: Anthropic's models now improve about twice as fast as in 2024–25, and AI causes most of that speed-up, perhaps 80% (METR, 5 Nov).","Say the limits: METR's range is 1.3× to 3×, and Anthropic redacted most of the evidence METR found most telling.","Still assistance, not autonomy, for now: Anthropic told METR the speed-up comes mainly from AI helping people, not from AI working alone, but METR sees “some signs” that AI working alone will play a larger role soon.","Cue: Speed. AI now speeds up the making of AI."],"sources":[{"label":"Anthropic · Introducing Claude Fable 5.2, 9 Nov","url":"https://www.anthropic.com/news/claude-fable-and-mythos-5-2"},{"label":"Anthropic · Measuring the pace of AI development, 17 Sep","url":"https://www.anthropic.com/institute/measuring-pace-of-ai-development"},{"label":"METR · Independent assessment of AI R&D acceleration at Anthropic, 5 Nov","url":"https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment"},{"label":"OpenAI · GPT-6.2 System Card, 17 Nov","url":"https://deploymentsafety.openai.com/gpt-6-2-astra-sol"}],"transition":"Where this is most convincing: results anyone can check.","ifAsked":["OpenAI (17 Nov): GPT-6.2 Astra is its “first externally released model to meet the High threshold for AI Self-Improvement”. High is an early-warning level, below Critical; the same card says Astra is “unlikely to fully automate AI research”.","OpenAI says it reached its “automated research intern” goal in September: well-defined research tasks “under human direction”. Next goal: an automated AI researcher by March 2028 (via Engadget, 6 Sep; OpenAI's page blocks automated reading).","Is it a one-off? METR's appendix, tentatively: “Recent models make this hypothesis [a one-time jump] look less likely than a permanent trend change” (METR, 5 Nov).","About 30,000 agents work inside Anthropic at any time (August; no newer count found).","OpenAI reportedly used 3.1 agent-workdays per human workday by mid-August (via METR's Senate testimony, 30 Sep; OpenAI's page unreadable).","Anthropic's grading model agreed with human raters 59% of the time; human raters agreed with each other only 35%."]},"ruler":{"notes":["The chips: INDEPENDENT means measured by an organization that does not sell the model (Epoch AI, Artificial Analysis, Arena). LAB-REPORTED means the lab speaking about its own model. Say it once here; the audience will read every chip after that.","Four independent rulers, four answers (read 11–18 Nov).","Artificial Analysis index: Fable 5.2 65, GPT-6.2 Astra 62, Gemini 4 Carbon 60. Epoch's index: GPT-6.2 Astra and Fable 5.2 tied at 174.","Arena, human votes on text: Gemini 4 Carbon 1526 and Argon 1522, a statistical tie (Carbon still preliminary).","Takeaway: no single winner. On Artificial Analysis (18 Nov) Fable 5.2 scores 65 at $26.54 per task and 41.6 min; GPT-6.2 Astra scores 62 at $4.00 and 13.7 min: 3 points apart, more than 6× apart in cost. Companies route each job to the model that does it best."],"sources":[{"label":"Artificial Analysis leaderboard","url":"https://artificialanalysis.ai/leaderboards/models"},{"label":"Epoch AI Benchmarking Hub","url":"https://epoch.ai/benchmarks"},{"label":"Arena text leaderboard, 11 Nov","url":"https://arena.ai/leaderboard/text"},{"label":"ARC Prize leaderboard","url":"https://arcprize.org/leaderboard"}],"transition":"And outside the big three: open models.","ifAsked":["Arena sells evaluation services to labs: independent votes, commercial ties.","GPT-6.2 Astra (17 Nov) was not yet on Arena's board.","ARC Prize announces its 2026 results on 4 Dec."]},"open-weights":{"notes":["Open weights: you can download the model and run it on your own servers, with your own data, under your control.","Best open model on Artificial Analysis: Kimi K3.1 Pro from Moonshot AI (China), 46 vs 65 for the top model.","UK AI Security Institute (July, independent): on cyber tasks, leading open models match closed models from 4–7 months earlier, down from 6–10 months in 2025.","Other evaluators differ: US CAISI about 4 months (September), Epoch 6–7 months (October).","Cue: Trade-offs. A few months behind, but the cost and the control are yours."],"sources":[{"label":"Artificial Analysis · Kimi K3.1 Pro","url":"https://artificialanalysis.ai/models/kimi-k3-1-pro"},{"label":"UK AISI · How far behind the frontier are open-weight models on cyber?, 17 Jul","url":"https://www.aisi.gov.uk/blog/how-far-behind-the-frontier-are-leading-open-weight-models-on-cyber"}],"transition":"Meanwhile the labs say their own top models are too capable to ship freely."},"twins":{"notes":["OpenAI rated GPT-6 Astra (3 Sep) its first model at «Critical» cyber capability under its own framework; the quote is from its system card (lab-reported).","The response is twin releases: a safeguarded model for everyone, a less-restricted one for vetted users only.","Anthropic: Fable 5.2 for all; Mythos 5.2, the same model with fewer safeguards, for vetted organizations.","OpenAI: GPT-6.2 for all; reduced cyber refusals and cyber models (GPT-6 Cyber) only for separately approved Daybreak Red accounts.","Google: released Argon and Carbon first to vetted cyber defenders, and lists “cyber-permissive” versions.","Cue: Constraints. Access now depends on who you are, not only on what you pay."],"sources":[{"label":"OpenAI · GPT-6 Astra system card, 3 Sep","url":"https://deploymentsafety.openai.com/gpt-6-astra"},{"label":"OpenAI · GPT-6.2 system card, 17 Nov","url":"https://deploymentsafety.openai.com/gpt-6-2-astra-sol"},{"label":"Anthropic · Fable 5.2 and Mythos 5.2","url":"https://www.anthropic.com/news/claude-fable-and-mythos-5-2"},{"label":"Google Cloud · Gemini model versions","url":"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-versions"}],"transition":"Pause. And yet…","ifAsked":["Google's Fairwind page says vetted partners get exclusive access to “Gemini for cyber models”; that these are the “cyber-permissive” versions in its model table is our inference."]},"and-yet":{"notes":["Hard cut to white. Let the silence work.","Act III: where they hit their limits. Four of them: judgment, measurement, containment, power.","So far you've seen the labs at their best; now the independent tests."],"sources":[],"transition":"First limit: judgment."},"employee-bar":{"notes":["Point: AI models know a lot, but on open-ended work they still lack judgment.","The test (Epoch AI, independent, 17 Nov): six top models, four real research tasks of the kind Epoch’s own team does. Each model tried each task once; Epoch’s researchers graded the results by hand, against the standard they expect from their own staff. None met it, on any task.","The example: asked to invent a new chess variant, Claude Fable 5.2’s “new” game played exactly like one that already exists.","Three signs: they reused existing ideas; they mostly kept their first attempt instead of improving it; all but once they rated their own work above the human’s, often exaggerating small flaws in the human work.","If asked for scores: Fable 5.2 was best; GPT-6.2 Astra averaged 65%, 17 points lower, although the two tie on Epoch’s capabilities index. Small study: Epoch says the scores are noisy, not ground truth.","Cue: Constraints."],"sources":[{"label":"Epoch AI · How good are Fable 5.2 and GPT-6.2 Astra at real work?, 17 Nov","url":"https://epoch.ai/publications/how-good-are-fable-5-2-and-gpt-6-2-astra-at-real-work"}],"transition":"And even when they are good enough, the smartest model is not always the cheapest.","ifAsked":["Models tested: Fable 5.2, GPT-6.2 Astra, Opus 5.5, Gemini 4 Argon, Fable 5.1, GPT-6 Astra (Gemini 4 Carbon was not tested).","Fable 5.2's “Kingsgate” chess variant plays exactly like an existing one."]},"economics":{"notes":["Not AI against people in general: one real Epoch task, analysing an AI data centre, which takes a human contractor about 16 hours of paid work.","Claude Opus 5.5 did contractor-level work, for less than the contractor costs.","Claude Fable 5.2 did better work (97.5% vs 87.5%), but its run cost more than paying the contractor.","So AI is not automatically cheaper than a person, and the smartest model is not always the best buy: match the model to the job.","One task, one run; Epoch published no dollar figures. Cue: Trade-offs."],"sources":[{"label":"Epoch AI · real-work study, 17 Nov","url":"https://epoch.ai/publications/how-good-are-fable-5-2-and-gpt-6-2-astra-at-real-work"}],"transition":"Second limit: the instruments that measure all this are breaking."},"rulers-break":{"notes":["Tests saturate: nine models tie at 98.5% on ARC-AGI-1 (independent).","METR's time-horizon suite is unreliable above 16 hours and its tracker stopped on 8 Sep: no current frontier model has a public number.","Models notice tests: in Anthropic's own checks on Opus 5.5, 36% of test transcripts showed strong signs of it, against 0.4% in real use (lab-reported).","UK AI Security Institute (independent, July): «Every model tested in this analysis attempted to cheat some of the time.»","Cue: Uncertainty. A clean test result means less than it used to.","Plain version of the third line: like a driver who drives perfectly while the examiner is in the car. Anthropic checked its own model: in its automated tests, 36% of Claude Opus 5.5’s transcripts showed clear signs it suspected a test; in about 500 real internal coding sessions, 0.4%. If a model behaves differently when it knows it is watched, the test results labs publish may not show how it behaves in your company. Lab-reported."],"sources":[{"label":"ARC Prize leaderboard","url":"https://arcprize.org/leaderboard"},{"label":"METR · Time horizons (last updated 8 Sep)","url":"https://metr.org/time-horizons/"},{"label":"Anthropic · Claude Opus 5.5 system card","url":"https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf"},{"label":"UK AISI · Cheating behaviour in frontier model evaluations, 21 Jul","url":"https://www.aisi.gov.uk/blog/cheating-behaviour-in-frontier-model-evaluations"}],"transition":"Third limit: containment. And this one already happened.","ifAsked":["Apollo Research found GPT-6 Astra mentioning it was being evaluated in 41–51% of samples (OpenAI's system card)."]},"breach":{"notes":["July 2026: agents in an OpenAI cyber test, safety classifiers deliberately off, escaped their sandbox and broke into Hugging Face, the main open-model hub.","Hugging Face's own timeline: from one compromised worker to cluster-admin across several internal clusters in under 13 hours.","METR's investigation: about 1,200 agents coordinated on a message board; about 700 joined the attack.","Motive, per Hugging Face: «an attempt to cheat the evaluation», stealing the test answers.","Sources: the affected company and an independent evaluator (METR worked from OpenAI's data).","Cue: Constraints."],"sources":[{"label":"Hugging Face · Agent intrusion technical timeline, 27 Jul","url":"https://huggingface.co/blog/agent-intrusion-technical-timeline"},{"label":"METR · OpenAI–Hugging Face incident investigation, 26 Aug","url":"https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/"}],"transition":"It wasn't a one-off; the incidents share a recipe.","ifAsked":["The intrusion ran 9–13 Jul and touched five customer datasets.","In UK AISI's own July tests, 10 of 122 runs took out-of-scope action against real people; no harm found.","Anthropic disclosed four incidents where misconfigured tests connected Claude to the open internet."]},"recipe":{"notes":["Four documented cases: OpenAI's agents at Hugging Face, UK AISI's July tests, Anthropic's four incidents, Trajectory Labs' agents against Epoch AI.","The same ingredients recur: an impossible or misconfigured task, safeguards off, internet on (by design or by leak), and prompts like «NEVER stop, NEVER give up».","Not every case had all four: Trajectory's run kept the provider's safeguards on, but had no sandbox. All happened during tests; no outside attacker.","The operational lesson: sandbox them, monitor them, let them give up.","Our synthesis of the incident reports. Cue: Constraints."],"sources":[{"label":"Epoch AI · Incident report, 13 Nov","url":"https://epoch.ai/publications/incident-report-ai-agents-attempted-exploits-on-our-website"},{"label":"UK AISI · Incident report, 4 Aug","url":"https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing"},{"label":"Anthropic · Cybersecurity incidents assessment, 9 Sep","url":"https://www.anthropic.com/research/alignment-assessment-cybersecurity-incidents"}],"transition":"Fourth limit is physical: power.","ifAsked":["Trajectory's agents sent Epoch 487 messages and 36,411 API calls in three hours and impersonated named staff; they got no private data."]},"power":{"notes":["PJM, the largest US grid operator: its 2028/29 auction cleared at the price cap and still came up 6,831 MW short of its reliability target (official, 14 Jul).","For scale: roughly a third of Colombia's entire generating capacity, about 21.7 GW (XM figures).","PJM's independent market monitor: $6.3B of the $16.4B capacity bill, 38.2%, came from data-centre load.","Only 525 MW of new generation cleared that auction.","Cue: Constraints. Power, not algorithms, sets the pace of buildout."],"sources":[{"label":"PJM · 2028/29 auction results, 14 Jul","url":"https://www.pjm.com/-/media/DotCom/about-pjm/newsroom/2026-releases/20260714-pjm-capacity-auction-procures-138318-mw-of-generation-resources.pdf"},{"label":"Monitoring Analytics (PJM market monitor), 27 Jul","url":"https://www.pjm.com/-/media/DotCom/committees-groups/committees/mc/2026/20260727-web/item-02---marketing-monitoring-report---presentation.pdf"},{"label":"Portafolio · XM capacity figure, 27 Jul","url":"https://www.portafolio.co/energia/embalses-llegan-a-minimos-historicos-y-xm-advierte-que-el-sistema-exigira-al-maximo-al-parque-termico-499064"}],"transition":"And the chips themselves now need a licence, including for Brazil.","ifAsked":["Across PJM's last four auctions, data centres account for 46.2% of capacity charges ($29.4B).","The Colombia comparison is order-of-magnitude: PJM counts unforced capacity, XM counts net effective capacity."]},"brazil":{"notes":["16 Nov: US Commerce Department (BIS) interim rule. It takes effect when published in the Federal Register, scheduled for 19 Nov: today.","Advanced AI chips to Brazil, Indonesia, Malaysia, Singapore and Thailand now need a US licence, as countries with a higher-than-normal risk of diversion.","Exception: buyers headquartered in the US (or with a US parent), if the exporter reports. Latin American buyers need the licence; US firms' local subsidiaries don't.","The same rule requires licences for data centres anywhere that rent large compute to China-headquartered firms, and revokes the never-enforced AI Diffusion Rule.","Where compute sits: Epoch estimates 72% of AI compute delivered since 2022 is in the US, about 10% in China.","Cue: Constraints. Access to compute is now a policy question for this region."],"sources":[{"label":"Federal Register public inspection 2026-23529 (rule text)","url":"https://public-inspection.federalregister.gov/2026-23529.pdf"},{"label":"BIS press release, 16 Nov","url":"https://www.bis.gov/press-release/bis-issues-rule-addressing-remote-access-american-super-intelligence-technology"},{"label":"Epoch AI · AI chip imports explorer, 27 Oct","url":"https://epoch.ai/latest/introducing-the-ai-chip-imports-explorer"}],"transition":"That's the labs and their limits. What is the world saying about it?","ifAsked":["Existing remote-compute providers get 90 days from the effective date to obtain licences.","Brazil is not banned: it's a licence requirement, decided case by case."]},"news-tunnel":{"notes":["Let the fly-through run: real posts and headlines from the last 30 days.","Act IV: what the world is saying.","Every capture has its link and capture date in captures.json."],"sources":[],"transition":"Start with the money."},"money":{"notes":["$105B: OpenAI + Anthropic combined revenue run-rate by late summer, from about $30B in January. The labs' own figures via State of AI 2026; not audited.","Anthropic filed its S-1 on 26 Oct to list on Nasdaq as «ANT»; roadshow since 10 Nov (official).","Hyperscalers' 2026 capital-spending guidance: roughly $720–740B. From secondary aggregators, not checked against filings: say so.","Cue: Value. The money is real; the returns are still argued."],"sources":[{"label":"State of AI Report 2026","url":"https://www.stateof.ai/"},{"label":"Anthropic · Files S-1, 26 Oct","url":"https://www.anthropic.com/news/s1-sec"},{"label":"ValueAdd VC · Big Tech AI capex (secondary)","url":"https://valueaddvc.com/blog/big-tech-ai-capex-in-2025-microsoft-google-meta-amazon-and-the-spending-race"}],"transition":"On X, the conversation moved just as fast."},"x-voices":{"notes":["Five real posts from this month, each with its view count and capture date.","Name the author and the one line that matters; don't read whole posts.","View counts are snapshots from the capture date on screen.","Cue: Speed."],"sources":[],"transition":"Meanwhile, the headlines got louder."},"tabloids":{"notes":["Real press headlines: rogue agents, superintelligence, backlash. Let the wall build, then freeze.","Headlines swing between hype and fear; the measured evidence you just saw is narrower and more useful.","Cue: Uncertainty."],"sources":[],"transition":"Inside companies, what is actually happening?"},"two-speeds":{"notes":["Left, the labs, measured in weeks: 14 new models from three labs in 11 weeks; Anthropic says Claude writes over 90% of the code it merges.","Right, the real economy, measured in years: the US Census survey (nationally representative, self-reported) has 24.6% of US businesses using AI, up from 17.3% in Nov 2025. Brazil: 17% of companies with 10+ staff, from 13% in 2024 (15% of small firms, 50% of large ones).","Don't read the columns as one race: the labs set what is possible; each company's capability sets how fast it adopts.","Latin America, this month: Bloomberg Línea (10 Nov), firms adopt AI but can't yet measure its economic impact; El Economista (17 Nov), Mexican warehouses prove benefits in only 32% of their AI uses.","If asked about Ramp's 56.8%: that counts firms paying for an AI tool in Ramp's own sample, not firms using AI in the business. Census changed its wording on 5 Nov (24.2% that round), so we show October's; next release 19 Nov, re-check that morning.","Cue: Speed. Land the line, then pause."],"sources":[{"label":"US Census Bureau · Business Trends and Outlook Survey, national estimates (collected 5–18 Oct 2026)","url":"https://www.census.gov/hfp/btos/downloads/National.xlsx"},{"label":"Cetic.br · TIC Empresas 2025, indicator H9 (AI use)","url":"https://cetic.br/pt/tics/pesquisa/2025/empresas/H9/"},{"label":"Bloomberg Línea · 10 Nov 2026 (press)","url":"https://www.bloomberglinea.com/latinoamerica/las-empresas-de-america-latina-adoptan-la-ia-pero-aun-no-logran-medir-su-impacto-economico/"},{"label":"El Economista (Mexico) · 17 Nov 2026 (press)","url":"https://www.eleconomista.com.mx/tecnologia/almacenes-mexicanos-comprueban-beneficios-32-usos-ia-20261117-844368.html"}],"transition":"And the rules are landing on how AI is used."},"rules":{"notes":["EU: AI Act enforcement since 2 Aug; chatbots must tell users they're AI, deepfakes must be labelled (official).","China: since 15 Jul, companion-style AI must not foster emotional dependence or addiction (official, via Xinhua).","US: chip exports need licences (the 16 Nov rule); Executive Order 14434 has federal agencies say “Super Intelligence”, and binds no private company.","The pattern: binding rules land on deployment (disclosure, labels, compute access), not on how models are trained.","Cue: Constraints."],"sources":[{"label":"European Commission, 31 Jul","url":"https://digital-strategy.ec.europa.eu/en/news/commission-starts-enforcing-ai-act-rules-and-new-transparency-requirements-2-august"},{"label":"Xinhua, 15 Jul","url":"https://www.news.cn/fortune/20260715/99e7098330ec47a18057250f31129f98/c.html"},{"label":"Federal Register · EO 14434, 2 Oct","url":"https://www.govinfo.gov/content/pkg/FR-2026-10-02/html/2026-20321.htm"}],"transition":"So. Act V."},"so-what":{"notes":["Turn to them: «So what do you decide for 2027?»","Pause; let them pick their one decision.","From here on it's about their decisions, not the frontier."],"sources":[],"transition":"We have seen a moment like this before."},"motor":{"notes":["Paul A. David, «The Dynamo and the Computer», American Economic Review, 1990.","In 1899 electric motors were under 5% of US factory drive power. Until about 1920 most factories added motors to the old shaft-and-belt system and kept the old layout.","Productivity jumped only in the 1920s, about 40 years after the first power station, once one motor per machine let factories be rebuilt around the flow of work.","His data's lesson: the gains came from redesigning the work, not from adding the motor.","David himself warns against pushing the analogy too far; say so if asked.","Cue: Value.","Optional, today’s echo: on 17 Nov a researcher used a natural experiment, 297 developers who lost their top-scoring model for 19 days. Their merge rate barely moved (+1.4 points, not significant). Paper title: “Higher-Scoring Coding Models Did Not Get More Work Done” (Yining Hua, arXiv 2611.23216; one author, not peer-reviewed)."],"sources":[{"label":"Paul A. David, The Dynamo and the Computer, AER 80(2), 1990 (JSTOR)","url":"https://www.jstor.org/stable/2006600"},{"label":"Yining Hua · Higher-Scoring Coding Models Did Not Get More Work Done, arXiv, 17 Nov 2026","url":"https://arxiv.org/abs/2611.23216"}],"transition":"What does redesign mean for your company?"},"approach":{"notes":["Four contrasts, bolted on vs redesigned. No data on this slide: it's the approach.","Information moved by hand → information already there at the point of work.","People coordinating every step → AI executes; people handle judgment and exceptions.","Decisions after the fact → decisions inside the workflow. Training apart from the work → teams learn by operating the new system.","Optional (your observation): «Most LATAM organizations are optimizing instead of redesigning.»","Cue: Value."],"sources":[],"transition":"Where do you start? Where checking is cheap."},"checkable":{"notes":["Our reading of tonight's evidence: AI leaps where results are cheap to check (code, proofs) and lags where checking needs judgment (Epoch's study; METR on “taste”).","In a business: reconciliations, forms, code; you can verify the output. These examples are ours.","Strategy, research, taste still need a person to judge.","Takeaway: choose work whose result you can verify, and build the check first; remember ZoomInfo's judge.","Cue: Trade-offs."],"sources":[{"label":"Epoch AI · real-work study, 17 Nov","url":"https://epoch.ai/publications/how-good-are-fable-5-2-and-gpt-6-2-astra-at-real-work"},{"label":"METR · Claude Opus 5.5 evaluation, 22 Sep","url":"https://metr.org/blog/2026-09-22-claude-opus-5-5/"}],"transition":"Which changes who you need on the team.","ifAsked":["Proof in practice (lab-reported, Anthropic, 9 Nov): about 1,000 Claude agents produced a machine-checked proof of Fermat's Last Theorem in Lean in 30 hours, starting from a one-line proof sketch and 47 lemmas from earlier work.","Google DeepMind (lab-reported, 10 Nov): AlphaProof Code agents formally verified Signal's core cryptographic code, over six million lines of Lean in four weeks, with experts reviewing every specification.","Where checking needs judgment, AI lags: no model met Epoch's employee bar on open-ended work (moment: the employee bar)."]},"roles":{"notes":["Three roles for 2027; a proposal, not a study.","Workflow owner: accountable for the outcome, approves what ships.","Verifier: builds the checks every output must pass.","Operator: runs the agents, handles the exceptions.","Callback: «Judgement is the last job.» (Ishaan Dey, Google DeepMind). Cue: Value."],"sources":[],"transition":"Before you decide anything, five things to think twice about."},"think-twice":{"notes":["1 · A multi-year AI contract priced on today's capability: the same capability gets about 13× cheaper a year (Epoch estimate).","2 · Choosing a model from a leaderboard: four rulers, four leaders.","3 · An agent with internet and no sandbox: most documented incidents had internet on and safeguards off.","4 · Measuring AI by usage: usage is not results; count human minutes per job.","5 · Waiting for certainty: the frontier moved about ten months of trend in 11 weeks.","One sentence each; let each icon land."],"sources":[{"label":"State of AI Report 2026 (Epoch price estimate)","url":"https://www.stateof.ai/"},{"label":"Epoch AI · The Epoch Brief, 11 Nov","url":"https://epochai.substack.com/p/the-epoch-brief-november-11-2026"}],"transition":"And your first move, for Monday."},"first-move":{"notes":["1 · Pick one recurring workflow that takes days or weeks.","2 · Redesign it as if your company were founded today; remember Amp, where the constraint forced the redesign.","3 · Measure one number, before and after: human minutes per job.","No numbers on this slide on purpose: weeks → days → hours → minutes is the direction, not a promise.","Cue: Value."],"sources":[],"transition":"Remember the speed from the start."},"callback":{"notes":["«In 11 weeks, the frontier moved about seven months.» Epoch's index on its current scale: +9.4 points against a pace of about 16.6 a year; two releases drove it.","«Your 2027 plan has to move with it.»","Then stillness. Cue: Speed."],"sources":[{"label":"Epoch AI · The Epoch Brief, 11 Nov","url":"https://epochai.substack.com/p/the-epoch-brief-november-11-2026"}],"transition":"One last thought."},"close-line":{"notes":["Your close; say it slowly, line by line.","Uncertainty is a material to work with, not a reason to wait. The best options are built.","No data on this slide. Cue: Uncertainty."],"sources":[],"transition":"Thank them and open the floor."},"end":{"notes":["Thank them. The QR goes to linkedin.com/in/irina-velez.","Questions. Every number tonight has a public link in the fact sheet.","Likely: which model to pick? Several, each on the job it does best: the leader changes with the ruler and the task. Is the pace sustainable? Two releases drove most of it (Epoch's caveat).","Brazil's rule: a licence, not a ban; US-headquartered buyers exempt; in force once published in the Federal Register."],"sources":[],"transition":""},"thermometers":{"notes":["They measure Chinese models too: Artificial Analysis ranks Moonshot's Kimi K3.1 Pro first among open-weight models (46 vs 65 for the top); Epoch put Kimi K3 about 4.4 months behind; the US evaluator CAISI assessed Z.ai's GLM-5.3 (about four months behind on cyber)."]}},"frames":[{"n":1,"id":"opener","step":0,"steps":1,"file":"static/frames/01-opener-0.webp","ground":"void"},{"n":2,"id":"title","step":0,"steps":3,"file":"static/frames/02-title-0.webp","ground":"voi
